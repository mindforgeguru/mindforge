name: CI

on:
  # Every branch, deliberately. The previous allowlist was
  # [main, feature/**, fix/**, test/**], which silently excluded any branch
  # named outside that scheme — `create_school` carried multi-tenancy, the
  # realtime fan-out rewrite and a cross-school leak fix without a single CI
  # run. An allowlist that has to be remembered at branch-creation time is a
  # gate that fails open, and it failed open for weeks.
  #
  # PRs into main still run too; a PR from a branch in this repo means two runs
  # for the same commit, which is cheap next to merging something unverified.
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  # Lets the suites below be run on demand against any branch.
  #
  # `run_api_integration` is opt-in and defaults to false ON PURPOSE. That job
  # runs tests/test_api.py, whose BASE_URL is https://api.mindforge.guru — it
  # registers, approves and revokes users against **production**. Gating it on
  # the bare `workflow_dispatch` event would mean a plain
  # `gh workflow run ci.yml` silently wrote to the live database, which is not
  # something anyone should trigger by accident while trying to check the unit
  # tests.
  workflow_dispatch:
    inputs:
      run_api_integration:
        description: "Run the live-API suite — WRITES TO PRODUCTION"
        type: boolean
        default: false

jobs:
  # ── Backend unit tests (no DB/Redis needed) ──────────────────────────────────
  backend-unit:
    name: Backend unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r backend/requirements.txt pytest pytest-asyncio

      # Each test file gets its own pytest process. test_logout_handler.py and
      # test_websocket_auth.py install module-level sys.modules stubs that
      # mutate state shared with test_unit.py — keeping them in separate
      # interpreters avoids order-dependent failures (e.g. JWT secret
      # rebinding silently passing a tampered-token assertion). See
      # TEST_RECORD.md §10 if you want to revisit this.
      #
      # Globbed rather than listed file-by-file on purpose: the hand-written
      # list silently missed four files (test_schema_invariants, test_tenancy,
      # test_tenancy_wiring, test_realtime_fanout — 39 tests, including the
      # whole multi-tenancy safety net) for weeks. A new tests/test_*.py file
      # is now picked up automatically.
      #
      # The loop keeps going after a failure so one broken file doesn't mask
      # the rest, then exits non-zero if any file failed.
      - name: Run backend tests (one process per file)
        working-directory: backend
        run: |
          set -u
          status=0
          shopt -s nullglob
          files=(tests/test_*.py)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No test files matched tests/test_*.py"
            exit 1
          fi
          for f in "${files[@]}"; do
            echo "::group::$f"
            python -m pytest "$f" -v || status=1
            echo "::endgroup::"
          done
          exit $status

  # ── Dependency vulnerability audit ────────────────────────────────────────────
  dependency-audit:
    name: Python dependency audit (pip-audit)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pip-audit
        run: pip install pip-audit

      # Audits the pinned requirements against the Python advisory DB and fails
      # the build on any known-vulnerable package. If a CVE has no fix yet, add
      # `--ignore-vuln <ID>` below with a comment + tracking link.
      #
      # ── Ignored advisories ────────────────────────────────────────────────
      # PYSEC-2026-1325 (CVE-2024-23342) — Minerva timing attack on P-256 in
      #   `ecdsa`. Affects every released version and upstream has declared
      #   side-channel attacks out of scope, so there is no fix version to move
      #   to. `ecdsa` is a hard dependency of `python-jose`, not something we
      #   import. The vulnerable paths are ECDSA signing/keygen and ECDH
      #   (`SigningKey.sign_digest`); MindForge signs JWTs with **HS256**
      #   (symmetric HMAC — see `JWT_ALGORITHM` in app/core/config.py), so no
      #   ECDSA private-key operation is ever performed. Re-evaluate if the JWT
      #   algorithm ever changes to ES256/ES384/ES512, or drop it entirely by
      #   migrating off python-jose to PyJWT.
      #   https://osv.dev/vulnerability/PYSEC-2026-1325
      - name: Audit backend dependencies
        run: |
          pip-audit -r backend/requirements.txt --strict \
            --ignore-vuln PYSEC-2026-1325

  # ── Committed-secret scan ────────────────────────────────────────────────────
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest

    steps:
      # gitleaks scans commit history, not just the working tree, so it needs
      # the full clone — the default shallow fetch would scan one commit and
      # pass vacuously.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Pinned by digest-bearing tag rather than `latest`: a scanner that
      # silently changes rules between runs makes a green build meaningless.
      #
      # Allowlist and its rationale live in .gitleaks.toml. Baseline established
      # 2026-08-18 — 231 commits, 8 findings, all Firebase *client* keys (public
      # by design) plus one deliberately-invalid JWT test fixture. Zero real
      # secrets. The allowlist is value-scoped, not path-scoped, and was
      # falsified: a new high-entropy key in an already-allowlisted file is
      # still reported.
      # Pinned by digest = gitleaks v8.30.1, the exact image the baseline above
      # was measured with. Bump deliberately and re-baseline; do not float.
      - name: Scan history for committed secrets
        run: |
          docker run --rm -v "$PWD:/repo" \
            zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            detect --source=/repo --config=/repo/.gitleaks.toml \
                   --redact --no-banner --verbose

  # ── Dart/Flutter dependency audit ────────────────────────────────────────────
  dart-dependency-audit:
    name: Dart dependency audit (osv-scanner)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # pip-audit covers backend/requirements.txt only, so pubspec.lock — 192
      # packages — was entirely unscanned until 2026-08-18. There is no official
      # `dart pub audit`; OSV is the advisory source that actually indexes pub.
      # Baseline at introduction: 192 packages, 0 issues.
      # Pinned by digest for the same reason as gitleaks above — this is the
      # exact image the 192-package / 0-issue baseline was measured with.
      - name: Audit pubspec.lock against the OSV database
        run: |
          docker run --rm -v "$PWD/frontend:/src" \
            ghcr.io/google/osv-scanner@sha256:8108ae94eadea5a02c9bec6e646909d5b790b44bd62d7f5b7f0b1d6d0ffc7734 \
            scan source --lockfile=/src/pubspec.lock

  # ── Flutter unit + widget tests ───────────────────────────────────────────────
  flutter:
    name: Flutter unit & widget tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.4"
          channel: stable
          cache: true

      - name: Get packages
        working-directory: frontend
        run: flutter pub get

      # Warnings are fatal (catches dead code, unused declarations, undefined
      # names, etc. before they land); style infos stay non-fatal.
      - name: Analyze
        working-directory: frontend
        run: flutter analyze --no-fatal-infos

      - name: Unit tests
        working-directory: frontend
        run: flutter test test/unit/ --reporter expanded

      - name: Widget tests
        working-directory: frontend
        run: flutter test test/widget/ --reporter expanded

  # ── API integration tests (manual / scheduled only) ──────────────────────────
  api-integration:
    name: API integration tests (live server)
    runs-on: ubuntu-latest
    # Deliberately NOT `github.event_name == 'workflow_dispatch'` — see the
    # note on the trigger above. This suite writes to production, so it runs
    # only when someone explicitly ticks the input (or on a schedule, if one
    # is ever added).
    if: inputs.run_api_integration || github.event_name == 'schedule'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install httpx pytest

      - name: Run API tests
        env:
          ADMIN_MPIN: ${{ secrets.ADMIN_MPIN }}
        run: python -m pytest tests/test_api.py -v
