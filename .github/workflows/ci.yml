name: CI

on:
  push:
    branches: [main, "feature/**", "fix/**", "test/**"]
  pull_request:
    branches: [main]
  # Required for the api-integration job below, which gates on
  # `github.event_name == 'workflow_dispatch'`. Without this trigger declared
  # here that job could never run at all — `gh workflow run ci.yml` would be
  # rejected outright. Add `schedule:` here too if you want it on a timer; the
  # job's condition already accounts for it.
  workflow_dispatch:

jobs:
  # ── Backend unit tests (no DB/Redis needed) ──────────────────────────────────
  backend-unit:
    name: Backend unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r backend/requirements.txt pytest pytest-asyncio

      # Each test file gets its own pytest process. test_logout_handler.py and
      # test_websocket_auth.py install module-level sys.modules stubs that
      # mutate state shared with test_unit.py — keeping them in separate
      # interpreters avoids order-dependent failures (e.g. JWT secret
      # rebinding silently passing a tampered-token assertion). See
      # TEST_RECORD.md §10 if you want to revisit this.
      #
      # Globbed rather than listed file-by-file on purpose: the hand-written
      # list silently missed four files (test_schema_invariants, test_tenancy,
      # test_tenancy_wiring, test_realtime_fanout — 39 tests, including the
      # whole multi-tenancy safety net) for weeks. A new tests/test_*.py file
      # is now picked up automatically.
      #
      # The loop keeps going after a failure so one broken file doesn't mask
      # the rest, then exits non-zero if any file failed.
      - name: Run backend tests (one process per file)
        working-directory: backend
        run: |
          set -u
          status=0
          shopt -s nullglob
          files=(tests/test_*.py)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No test files matched tests/test_*.py"
            exit 1
          fi
          for f in "${files[@]}"; do
            echo "::group::$f"
            python -m pytest "$f" -v || status=1
            echo "::endgroup::"
          done
          exit $status

  # ── Dependency vulnerability audit ────────────────────────────────────────────
  dependency-audit:
    name: Python dependency audit (pip-audit)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pip-audit
        run: pip install pip-audit

      # Audits the pinned requirements against the Python advisory DB and fails
      # the build on any known-vulnerable package. If a CVE has no fix yet, add
      # `--ignore-vuln <ID>` below with a comment + tracking link.
      #
      # ── Ignored advisories ────────────────────────────────────────────────
      # PYSEC-2026-1325 (CVE-2024-23342) — Minerva timing attack on P-256 in
      #   `ecdsa`. Affects every released version and upstream has declared
      #   side-channel attacks out of scope, so there is no fix version to move
      #   to. `ecdsa` is a hard dependency of `python-jose`, not something we
      #   import. The vulnerable paths are ECDSA signing/keygen and ECDH
      #   (`SigningKey.sign_digest`); MindForge signs JWTs with **HS256**
      #   (symmetric HMAC — see `JWT_ALGORITHM` in app/core/config.py), so no
      #   ECDSA private-key operation is ever performed. Re-evaluate if the JWT
      #   algorithm ever changes to ES256/ES384/ES512, or drop it entirely by
      #   migrating off python-jose to PyJWT.
      #   https://osv.dev/vulnerability/PYSEC-2026-1325
      - name: Audit backend dependencies
        run: |
          pip-audit -r backend/requirements.txt --strict \
            --ignore-vuln PYSEC-2026-1325

  # ── Flutter unit + widget tests ───────────────────────────────────────────────
  flutter:
    name: Flutter unit & widget tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.4"
          channel: stable
          cache: true

      - name: Get packages
        working-directory: frontend
        run: flutter pub get

      # Warnings are fatal (catches dead code, unused declarations, undefined
      # names, etc. before they land); style infos stay non-fatal.
      - name: Analyze
        working-directory: frontend
        run: flutter analyze --no-fatal-infos

      - name: Unit tests
        working-directory: frontend
        run: flutter test test/unit/ --reporter expanded

      - name: Widget tests
        working-directory: frontend
        run: flutter test test/widget/ --reporter expanded

  # ── API integration tests (manual / scheduled only) ──────────────────────────
  api-integration:
    name: API integration tests (live server)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install httpx pytest

      - name: Run API tests
        env:
          ADMIN_MPIN: ${{ secrets.ADMIN_MPIN }}
        run: python -m pytest tests/test_api.py -v
